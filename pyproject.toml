[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "1c-ai-harness"
version = "0.1.0"
description = "Workspace bootstrapper, config generator and environment validator for 1C AI agent ecosystems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
harness = "harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".deps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D", "ANN", "S", "SIM", "RUF"]
ignore = ["D203", "D213", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "D", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
